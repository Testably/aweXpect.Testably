name: Build

on:
    push:
        branches: [ main ]
        tags: [ 'v[0-9]+.[0-9]+.[0-9]+*' ]

jobs:
    unit-tests:
        name: "Unit tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Run unit tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 CodeCoverage
            -   name: Run unit tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh CodeCoverage
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: ${{ runner.os }}-artifacts
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx

    aot-smoke-tests:
        name: "AOT smoke tests"
        strategy:
            fail-fast: false
            matrix:
                os: [ ubuntu-latest, windows-latest, macos-latest ]
        runs-on: ${{ matrix.os }}
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Run AOT smoke tests (windows)
                if: matrix.os == 'windows-latest'
                run: ./build.ps1 AotSmokeTests
            -   name: Run AOT smoke tests (ubuntu|macos)
                if: matrix.os != 'windows-latest'
                run: ./build.sh AotSmokeTests

    api-tests:
        name: "API tests"
        runs-on: ubuntu-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: API checks
                run: ./build.sh ApiChecks
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: API-tests
                    path: |
                        ./Artifacts/*
                        ./TestResults/*.trx
    
    mutation-tests:
        name: "Mutation tests"
        runs-on: windows-latest
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Add msbuild to PATH
                uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0
            -   name: Run mutation tests
                run: ./build.ps1 MutationTests
            -   name: Upload artifacts
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    name: MutationTests
                    path: |
                        ./Artifacts/*

    mutation-tests-dashboard:
        name: "Mutation tests Dashboard"
        needs: [ mutation-tests ]
        runs-on: ubuntu-latest
        env:
            STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Upload to mutation dashboard
                run: ./build.sh MutationTestDashboard
                env:
                    GithubToken: ${{ secrets.GITHUB_TOKEN }}
                    WorkflowRunId: ${{ github.run_id }}

    benchmarks:
        name: "Benchmarks"
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Run benchmarks
                run: ./build.sh Benchmarks
            -   name: Store benchmark result
                if: github.ref == 'refs/heads/main'
                uses: rhysd/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
                with:
                    name: Benchmark.Net Benchmark
                    tool: 'benchmarkdotnet'
                    output-file-path: Artifacts/Benchmarks/results/aweXpect.Testably.Benchmarks.HappyCaseBenchmarks-report-full-compressed.json
                    github-token: ${{ secrets.GITHUB_TOKEN }}
                    gh-pages-branch: 'benchmarks'
                    benchmark-data-dir-path: 'Docs'
                    auto-push: false
    
    static-code-analysis:
        name: "Static code analysis"
        runs-on: ubuntu-latest
        env:
            REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Run sonarcloud analysis
                run: ./build.sh CodeAnalysis
    
    publish-test-results:
        name: "Publish Tests Results"
        needs: [ api-tests, unit-tests, aot-smoke-tests ]
        runs-on: ubuntu-latest
        permissions:
            checks: write
            pull-requests: write
        if: always()
        steps:
            -   name: Download Artifacts
                uses: actions/download-artifact@v8
                with:
                    path: artifacts
            -   name: Publish Test Results
                uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
                with:
                    comment_mode: always
                    files: "artifacts/**/**/*.trx"
    
    pack:
        name: "Pack"
        runs-on: ubuntu-latest
        needs: [ publish-test-results, mutation-tests-dashboard, benchmarks, static-code-analysis ]
        env:
            DOTNET_NOLOGO: true
        steps:
            -   uses: actions/checkout@v7
                with:
                    fetch-depth: 0
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
                with:
                    dotnet-version: |
                        8.0.x
                        9.0.x
                        10.0.3xx
            -   name: Pack nuget packages
                run: ./build.sh Pack
            -   name: Upload packages
                if: always()
                uses: actions/upload-artifact@v7
                with:
                    path: Artifacts/Packages
                    name: Packages
    
    push:
        name: "Push"
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        runs-on: macos-latest
        environment: production
        needs: [ pack ]
        permissions:
            contents: write
            id-token: write
        steps:
            -   name: Download packages
                uses: actions/download-artifact@v8
                with:
                    name: Packages
                    path: Artifacts/Packages
            -   name: Setup .NET SDKs
                uses: actions/setup-dotnet@v6
            -   name: NuGet login
                id: login
                uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
                with:
                    user: ${{ secrets.NUGET_USER }}
            -   name: Publish
                run: |
                    echo "Found the following packages to push:"
                    search_dir=Artifacts/Packages
                    for entry in Artifacts/Packages/*.nupkg
                    do
                      echo "- $entry"
                    done
                    for entry in Artifacts/Packages/*.nupkg
                    do
                      dotnet nuget push $entry --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
                    done
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Create GitHub release
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
                with:
                    name: ${{ steps.tag.outputs.release_version }}
                    tag_name: ${{ steps.tag.outputs.release_version }}
                    token: ${{ secrets.GITHUB_TOKEN }}
                    generate_release_notes: true
    
    finalize-release:
        name: "Finalize release"
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        needs: [ push ]
        permissions:
            contents: read
            issues: write
            pull-requests: write
        steps:
            -   name: Check pre-release
                id: check-pre-release
                run: |
                    if [[ ${{ github.event.ref }} =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                        echo "release=true" >> $GITHUB_OUTPUT
                    fi
            -   name: Comment relevant issues and pull requests
                if: steps.check-pre-release.outputs.release == 'true'
                continue-on-error: true
                uses: apexskier/github-release-commenter@e7813a9625eabd79a875b4bc4046cfcae377ab34 # v1.4.1
                with:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    comment-template: |
                        This is addressed in release {release_link}.
                    label-template: |
                        state: released
                    skip-label: |
                        state: released

